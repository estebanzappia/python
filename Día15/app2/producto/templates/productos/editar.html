<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
        <div class="mb-6 pb-4 border-b border-slate-100">
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight text-center">Editar producto</h2>
            <p class="text-sm text-slate-500 text-center mt-1">Modifica los campos necesarios para actualizar el registro.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Código de barra</label>
                <input type="text" name="codigo_barra" value="{{ producto.codigo_barra }}" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Descripción</label>
                <input type="text" name="descripcion" value="{{ producto.descripcion }}" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Precio costo</label>
                    <input type="number" name="precio_costo" value="{{ producto.precio_costo }}" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Precio venta</label>
                    <input type="number" name="precio_venta" value="{{ producto.precio_venta }}" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">IVA</label>
                    <select name="iva" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                        <option value="EXENTO" {% if producto.iva == "EXENTO" %}selected{% endif %}>Exento</option>
                        <option value="5" {% if producto.iva == "5" %}selected{% endif %}>5%</option>
                        <option value="10" {% if producto.iva == "10" %}selected{% endif %}>10%</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Stock</label>
                    <input type="number" name="stock" value="{{ producto.stock }}" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Unidad de medida</label>
                <input type="text" name="unidad_medida" value="{{ producto.unidad_medida }}" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
            </div>

            <div class="flex items-center gap-3 pt-2">
                <a href="/productos/" class="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-xl text-center transition-all">
                    Cancelar
                </a>
                <button type="submit" class="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl shadow-md shadow-indigo-100 transition-all text-center">
                    Guardar cambios
                </button>
            </div>
        </form>
    </div>
</body>
</html>
