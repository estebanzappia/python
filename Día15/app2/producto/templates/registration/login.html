<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .caja-login {
            background-color: white;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        .caja-login h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .caja-login p {
            color: #c0392b;
            background-color: #fdecea;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .campo {
            margin-bottom: 15px;
        }
        .campo label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        .campo input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>
    <div class="caja-login">
        <h2>Iniciar sesión</h2>

        {% if form.errors %}
            <p>Usuario o contraseña incorrectos. Verificá los datos.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="campo">
                <label for="id_username">Usuario</label>
                {{ form.username }}
            </div>
            <div class="campo">
                <label for="id_password">Contraseña</label>
                {{ form.password }}
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
