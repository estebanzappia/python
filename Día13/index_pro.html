<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orkut</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    
    <!-- Sección izquierda: Presentación / Slider -->
    <div class="left-section">
      <img src="images.png" alt="Orkut Logo" class="img-logo" />
      <h3>Mira los momentos cotidianos de tus mejores amigos</h3>
      <div class="slider-wrapper">
        <img src="images.jfif" alt="Amigos" class="img-slider" />
      </div>
    </div>

    <!-- Sección derecha: Formulario de Login -->
    <div class="right-section">
      <div class="login-card">
        <h1>Inicia sesión en Orkut</h1>
        <form>
          <div class="input-group">
            <label for="usuario">Tu usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required />
          </div>

          <div class="input-group">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" placeholder="Ingresa tu contraseña" required />
          </div>

          <button type="submit" class="btn-submit">Iniciar sesión</button>
          
          <div class="links">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <hr />
            <a href="#" class="btn-create">Crear cuenta nueva</a>
          </div>
        </form>
      </div>
    </div>

  </div>
</body>
</html>
